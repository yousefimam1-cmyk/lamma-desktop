name: Build and release
# Every push builds the installer (check). A tag vX.Y.Z also signs it with SignPath (when
# SIGNPATH_API_TOKEN is set) and publishes a GitHub Release with LAMMA-Setup.exe + latest.yml.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: windows-latest
    env:
      HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - run: npx electron-builder --win nsis --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Stable file names
        run: |
          V=$(node -p 'require("./package.json").version')
          mkdir out
          cp "dist/LAMMA-Setup-$V.exe" out/LAMMA-Setup.exe
          sed "s/LAMMA-Setup-$V\.exe/LAMMA-Setup.exe/g" dist/latest.yml > out/latest.yml
      - id: upload
        uses: actions/upload-artifact@v4
        with:
          name: LAMMA-Setup-unsigned
          path: out/LAMMA-Setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: latest-yml-unsigned
          path: out/latest.yml

      - id: signpath
        name: Sign with SignPath
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: lamma-desktop
          signing-policy-slug: release-signing
          artifact-configuration-slug: initial
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
      - name: Use signed installer and refresh the update feed hash
        if: steps.signpath.outcome == 'success'
        run: |
          cp signed/LAMMA-Setup.exe out/LAMMA-Setup.exe
          node -e '
            const fs = require("fs"), crypto = require("crypto");
            const buf = fs.readFileSync("out/LAMMA-Setup.exe");
            const sha = crypto.createHash("sha512").update(buf).digest("base64");
            let y = fs.readFileSync("out/latest.yml", "utf8");
            y = y.replace(/sha512: .*/g, "sha512: " + sha).replace(/size: \d+/g, "size: " + buf.length);
            fs.writeFileSync("out/latest.yml", y);
          '
          cat out/latest.yml
      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.signpath.outcome == 'success' }}
        run: |
          NOTE="Signed by SignPath Foundation"
          [ "$SIGNED" = "true" ] || NOTE="UNSIGNED build (signing not set up yet)"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" out/LAMMA-Setup.exe out/latest.yml --clobber
            gh release edit "$GITHUB_REF_NAME" --notes "$NOTE"
          else
            gh release create "$GITHUB_REF_NAME" out/LAMMA-Setup.exe out/latest.yml --title "LAMMA $GITHUB_REF_NAME" --notes "$NOTE"
          fi
